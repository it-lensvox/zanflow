name: Deploy to EC2

on:
  push:
    branches:
      - main
      - shubhang

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            
            cd ${{ secrets.APP_DIR }}
            
            echo "📥 Pulling latest code..."
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            echo "🔧 Replacing localhost URLs with production URLs..."
            sed -i 's|VITE_API_URL=http://localhost:8000/api/v1|VITE_API_URL=https://zanflow.lensvox.com/api/v1|g' docker-compose.yml
            sed -i 's|VITE_API_BASE_URL=http://localhost:8000|VITE_API_BASE_URL=https://zanflow.lensvox.com|g' docker-compose.yml

            echo "🔧 Creating production frontend/.env..."
            cat > frontend/.env << 'EOF'
            VITE_API_URL=https://zanflow.lensvox.com/api/v1
            VITE_API_BASE_URL=https://zanflow.lensvox.com
            VITE_WS_URL=wss://zanflow.lensvox.com
            VITE_WS_GATEWAY_URL=wss://zanflow.lensvox.com/ws/gateway
            EOF

            echo "🔧 Setting production URLs in api.ts..."
            sed -i "s|http://localhost:8000/api/v1|https://zanflow.lensvox.com/api/v1|g" frontend/src/services/api.ts
            sed -i "s|http://localhost:8000|https://zanflow.lensvox.com|g" frontend/src/services/api.ts
            sed -i "s|ws://localhost:8000|wss://zanflow.lensvox.com|g" frontend/src/services/api.ts
            
            echo "🔍 Validating docker-compose.yml..."
            sudo docker-compose config > /dev/null
            
            echo "🔨 Building new images..."
            sudo docker-compose build

            echo "🚀 Restarting with new images..."
            sudo docker-compose up -d --force-recreate --no-build
            
            echo "⏳ Waiting for services..."
            sleep 15
            
            echo "📊 Container status:"
            sudo docker-compose ps
            
            echo "✅ Deployment completed!"