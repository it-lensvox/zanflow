name: Deploy to EC2

on:
  push:
    branches:
      - main
      - shubhang

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ${{ secrets.APP_DIR }}
            
            # Backup current .env files
            cp backend/.env backend/.env.backup 2>/dev/null || true
            cp frontend/.env frontend/.env.backup 2>/dev/null || true
            
            # Pull latest code
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Create production backend/.env
            cat > backend/.env << 'EOF'
            DEBUG=False
            SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            
            ALLOWED_HOSTS=localhost,127.0.0.1,backend,zanflow.lensvox.com
            CORS_ALLOWED_ORIGINS=http://zanflow.lensvox.com,https://zanflow.lensvox.com,http://localhost:3001
            CORS_ALLOW_ALL=False
            CORS_ALLOW_CREDENTIALS=True
            
            DB_NAME=${{ secrets.RDS_DB_NAME }}
            DB_HOST=${{ secrets.RDS_HOST }}
            DB_USER=${{ secrets.RDS_USER }}
            DB_PASSWORD=${{ secrets.RDS_PASSWORD }}
            DB_PORT=5432
            
            USE_S3=True
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_STORAGE_BUCKET_NAME=zanflow-projectdocuments
            AWS_S3_REGION_NAME=us-east-1
            BEDROCK_MODEL_ID=amazon.nova-lite-v1:0
            
            SES_SMTP_USER=${{ secrets.SES_SMTP_USER }}
            SES_SMTP_PASSWORD=${{ secrets.SES_SMTP_PASSWORD }}
            SES_REGION=us-east-1
            DEFAULT_FROM_EMAIL=ZanFlow Support <it@lensvox.com>
            
            FRONTEND_URL=https://zanflow.lensvox.com
            BACKEND_URL=https://zanflow.lensvox.com
            EOF
            
            # Create production frontend/.env
            cat > frontend/.env << 'EOF'
            VITE_API_URL=https://zanflow.lensvox.com/api/v1
            VITE_API_BASE_URL=https://zanflow.lensvox.com
            EOF
            
            # Rebuild and deploy
            sudo docker-compose down
            sudo docker system prune -af
            sudo docker-compose up --build -d
            
            echo "✅ Deployment completed!"
