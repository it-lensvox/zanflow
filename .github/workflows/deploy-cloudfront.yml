name: Deploy Frontend to CloudFront

on:
  push:
    branches:
      - main
      - shubhang

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Create production .env
        working-directory: frontend
        run: |
          cat > .env << 'EOF'
          VITE_API_URL=https://zanflow.lensvox.com/api/v1
          VITE_API_BASE_URL=https://zanflow.lensvox.com
          VITE_WS_URL=wss://zanflow.lensvox.com
          VITE_WS_GATEWAY_URL=wss://zanflow.lensvox.com/ws/gateway
          EOF

      - name: Set production URLs in api.ts
        working-directory: frontend
        run: |
          sed -i "s|http://localhost:8000/api/v1|https://zanflow.lensvox.com/api/v1|g" src/services/api.ts
          sed -i "s|http://localhost:8000|https://zanflow.lensvox.com|g" src/services/api.ts
          sed -i "s|ws://localhost:8000|wss://zanflow.lensvox.com|g" src/services/api.ts

      - name: Build frontend
        working-directory: frontend
        run: npx vite build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync to S3
        working-directory: frontend
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment complete
        run: echo "Frontend deployed to CloudFront!"